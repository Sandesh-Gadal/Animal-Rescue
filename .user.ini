; Read automatically by PHP when running as PHP-FPM/CGI (the common setup on
; shared/cPanel hosting). Without this, PHP's stock defaults
; (upload_max_filesize=2M, post_max_size=8M) silently drop photo uploads from
; real phone cameras before the app's own code ever runs -- the report form
; then fails with no clear error. These values back the max_upload_mb/
; max_photos limits actually enforced in config.php.
upload_max_filesize = 110M
post_max_size = 520M
max_file_uploads = 20
max_execution_time = 300
memory_limit = 512M
